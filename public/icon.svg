<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#3b82f6" rx="128"/>

  <!-- V3 Logo - Layers Icon -->
  <g transform="translate(256, 256)">
    <!-- Top Layer -->
    <path d="M-80 -60 L0 -100 L80 -60 L80 -40 L0 -80 L-80 -40 Z" fill="white" opacity="0.95"/>

    <!-- Middle Layer -->
    <path d="M-80 -20 L0 -60 L80 -20 L80 0 L0 -40 L-80 0 Z" fill="white" opacity="0.85"/>

    <!-- Bottom Layer -->
    <path d="M-80 20 L0 -20 L80 20 L80 40 L0 0 L-80 40 Z" fill="white" opacity="0.75"/>

    <!-- Shadow/Depth -->
    <path d="M-80 60 L0 20 L80 60 L80 80 L0 40 L-80 80 Z" fill="white" opacity="0.65"/>
  </g>

  <!-- V3 Text (Optional) -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white">V3</text>
</svg>
